<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Líniové príbehy</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>

<body>

<header class="app-header">
  <h1>Líniové príbehy</h1>

  <p class="subtitle">
    Kreatívne paralelné príbehy s podlíniami
  </p>
</header>

<main class="container">

  <!-- MODE -->

  <section class="card">

    <div class="section-title-row">
      <h2>Režim</h2>

      <p id="online-indicator" class="small muted">
        Lokálny režim
      </p>
    </div>

    <div class="mode-buttons">

      <button
        id="offline-mode-btn"
        class="btn mode-btn active-mode"
      >
        Lokálne
      </button>

      <button
        id="online-mode-btn"
        class="btn mode-btn"
      >
        Online
      </button>

    </div>

  </section>

  <!-- QUICK ACTIONS -->

  <section class="card">

    <div class="two-columns">

      <!-- RANDOM -->

      <div>

        <h2>Pokračuj v príbehu</h2>

        <p class="muted">
          Získaš náhodnú dejovú líniu.
        </p>

        <button
          id="get-line-btn"
          class="btn primary"
        >
          Náhodná línia
        </button>

      </div>

      <!-- CREATE LINE -->

      <div>

        <h2>Nová línia</h2>

        <div class="new-line-form">

          <div class="field">
            <label>Postava</label>

            <input
              id="persona-input"
              type="text"
              placeholder="Napríklad: Vedec"
            >
          </div>

          <div class="field">
            <label>Opis línie</label>

            <input
              id="line-description-input"
              type="text"
              placeholder="Krátky opis deja"
            >
          </div>

          <button
            id="create-line-btn"
            class="btn primary"
          >
            Vytvoriť líniu
          </button>

        </div>

      </div>

    </div>

  </section>

  <!-- ACTIVE LINE -->

  <section class="card">

    <div class="line-header">

      <div>
        <h2 id="line-title">
          Línia nie je vybraná
        </h2>

        <p
          id="line-description"
          class="muted"
        >
          Vyber alebo vytvor líniu.
        </p>
      </div>

      <button
        id="change-line-btn"
        class="btn secondary"
        disabled
      >
        Iná línia
      </button>

    </div>

    <!-- ENTRIES -->

    <h3>Posledné úryvky</h3>

    <div
      id="entries-list"
      class="entries empty"
    >
      <p>Zatiaľ bez úryvkov</p>
    </div>

    <div class="entry-form">

      <textarea
        id="entry-input"
        rows="4"
        placeholder="Napíš pokračovanie..."
      ></textarea>

      <button
        id="add-entry-btn"
        class="btn primary"
        disabled
      >
        Pridať pokračovanie
      </button>

    </div>

    <p
      id="status-message"
      class="status"
    ></p>

  </section>

  <!-- SUBLINES -->

  <section class="card">

    <div class="section-title-row">
      <h2>Podlínie</h2>
    </div>

    <div class="subline-form">

      <div class="field">
        <label>Názov podlínie</label>

        <input
          id="subline-title-input"
          type="text"
          placeholder="Názov"
        >
      </div>

      <div class="field">
        <label>Opis podlínie</label>

        <input
          id="subline-description-input"
          type="text"
          placeholder="Krátky opis"
        >
      </div>

      <button
        id="create-subline-btn"
        class="btn secondary"
        disabled
      >
        Vytvoriť podlíniu
      </button>

    </div>

    <div
      id="sublines-list"
      class="sublines-list empty"
    >
      <p>Žiadne podlínie</p>
    </div>

  </section>

  <!-- OVERVIEW -->

  <section class="card">

    <div class="section-title-row">

      <h2>Prehľad línií</h2>

      <div class="overview-actions">

        <button
          id="download-btn"
          class="btn secondary"
        >
          Export
        </button>

        <button
          id="reset-btn"
          class="btn danger"
        >
          Začať odznova
        </button>

      </div>

    </div>

    <div
      id="overview-grid"
      class="grid"
    ></div>

  </section>

</main>

<script src="script.js"></script>

</body>
</html>
